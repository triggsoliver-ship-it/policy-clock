# Render blueprint — connect this repo at https://dashboard.render.com and Render
# reads this file to create the service.
#
# STORAGE FIX (2026-09-03): this blueprint now specifies the "starter" plan with a
# persistent disk mounted at /var/data, and CLOCK_DB points there instead of /tmp.
# On the FREE plan, /tmp is wiped on every deploy and every spin-down after idle —
# so every customer account, school and recorded date created since the last
# restart was lost with it. The demo schools are unaffected (they are in git), and
# the [paid] log lines still let Oli reconstruct who paid, but a customer who set a
# password on Monday would find it gone on Tuesday.
#
# THIS FILE ALONE DOES NOT FIX ANYTHING YET. Render does not auto-upgrade an
# existing service's plan or attach a disk just because render.yaml changed —
# that needs a manual step on the Render dashboard for THIS existing service:
#   1. Open the policy-clock service on dashboard.render.com.
#   2. Settings → Instance Type → change from Free to Starter (paid, ~£6-7/month).
#   3. Add a disk: name "clock-data", mount path "/var/data", size 1GB.
#   4. Update the CLOCK_DB env var to /var/data/clock.db (should sync from this
#      file once the blueprint is re-applied, but check it manually).
#   5. Redeploy, then confirm /health reports storage.ephemeral: false and
#      storage.location: /var/data/clock.db.
# That upgrade costs real money every month, so it's Oli's call to click "confirm"
# on the Render dashboard — not something this file or a commit does on its own.
# The server logs a boxed warning at boot and /health reports storage.ephemeral
# while the service is still actually on the free plan, regardless of what this
# file says — trust /health's live report over this file's intent.
services:
  - type: web
    name: policy-clock
    runtime: node
    plan: starter
    disk:
      name: clock-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: CLOCK_DB
        value: /var/data/clock.db
      # Signs CSRF tokens. Generated once by Render and kept out of git. Without it
      # the server makes one up at boot, which only means forms already open across
      # a restart need a reload — but set it is better than not.
      - key: SESSION_SECRET
        generateValue: true
      # Secrets — set these in the Render dashboard, never in this file.
      # sync: false means Render prompts for a value and keeps it out of git.
      # Checkout returns 502 / "not keyed" until STRIPE_SECRET_KEY and all three
      # price IDs are present; the webhook refuses events until the secret is set.
      # /welcome also uses STRIPE_SECRET_KEY to confirm a session and provision
      # from it if the webhook has not landed yet.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_SCHOOL
        sync: false
      - key: STRIPE_PRICE_FEDERATION
        sync: false
      - key: STRIPE_PRICE_TRUST
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
